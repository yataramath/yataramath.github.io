<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ドーナツ型の碁盤で打つ囲碁。トーラスとねじれトーラス、9路と13路。CPUの最強に勝つと名前が残ります。オンライン対戦もできます。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>トーラス囲碁</title>
<script>document.documentElement.dataset.theme = 'dark';   // this game is always shown in its dark colors</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: a slim site bar shared by every game, then one screen of play (3D stage left, scorecard + controls right), the hall of fame below on scroll; stacks on phones */
:root{
  --bg:#e7eaf0;
  --stage-1:#f6f7fa;
  --stage-2:#d5dae4;
  --panel:#f4f6f9;
  --ink:#151a24;
  --muted:#596274;
  --line:#c8cedb;
  --accent:#3b4ea3;
  --accent-soft:#dde2f5;
  --on-accent:#ffffff;
  --warn:#c4432f;
  --gold:#9a6a14;
  --wood:#d8a659;
  --wood-ink:#7a5420;
  --stone-b:#15171b;
  --stone-b-hi:#4d5159;
  --stone-w:#d9d8d1;
  --stone-w-hi:#ffffff;
  --shadow:rgb(16 22 36 / .22);
  --scrim:rgb(231 234 240 / .74);
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1219; --stage-1:#1b202c; --stage-2:#0a0d13; --panel:#141822;
    --ink:#e4e8f0; --muted:#8e97a9; --line:#272e3b;
    --accent:#93a4ef; --accent-soft:#242c48; --on-accent:#0d1226; --warn:#f07a64; --gold:#efc05c;
    --wood-ink:#e9bf7a; --shadow:rgb(0 0 0 / .5); --scrim:rgb(9 12 18 / .74);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1219; --stage-1:#1b202c; --stage-2:#0a0d13; --panel:#141822;
  --ink:#e4e8f0; --muted:#8e97a9; --line:#272e3b;
  --accent:#93a4ef; --accent-soft:#242c48; --on-accent:#0d1226; --warn:#f07a64; --gold:#efc05c;
  --wood-ink:#e9bf7a; --shadow:rgb(0 0 0 / .5); --scrim:rgb(9 12 18 / .74);
  color-scheme:dark;
}
/* the 3D stage is always dark, so the wooden board stands out (the rest of the page follows the light/dark setting) */
.stage{
  --bg:#0f1219; --stage-1:#252c3a; --stage-2:#0a0d13; --panel:#161b26;
  --ink:#e4e8f0; --muted:#98a1b3; --line:#2c3443;
  --accent:#93a4ef; --accent-soft:#242c48; --on-accent:#0d1226; --warn:#f07a64; --gold:#efc05c;
  --wood-ink:#e9bf7a; --shadow:rgb(0 0 0 / .5); --scrim:rgb(9 12 18 / .74);
  color:var(--ink); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.65}
button,input{font:inherit;color:inherit}

/* site bar (same on every game page) */
.sitebar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:52px;padding-inline:16px;border-bottom:1px solid var(--line);background:var(--bg)}
.home{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:700;font-size:14px;min-width:0}
.home svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.home span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home small{font-weight:500;color:var(--muted)}
.home:hover span{text-decoration:underline}
.home:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
/* the English site name is long: on phones it takes two short lines instead of being cut off */
@media (max-width: 520px){ html[lang="en"] .home span{white-space:normal;line-height:1.2;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical} html[lang="en"] .home small{display:none} }
.bar-tools{display:flex;gap:8px;flex:none}
.tool{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;background:var(--panel)}
.tool:hover{border-color:var(--ink)}
.tool:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tool svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool .off{display:none}
.tool[aria-pressed="false"] .on{display:none}
.tool[aria-pressed="false"] .off{display:inline}
.lang-tool{width:auto;padding:0 11px;font-size:12.5px;font-weight:700}

.app{height:calc(100vh - 52px);height:calc(100svh - 52px);min-height:600px;display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;padding-block:16px;padding-inline:16px}

/* ---------- stage ---------- */
.stage{position:relative;min-width:0;min-height:0;border-radius:20px;border:1px solid var(--line);overflow:hidden;
  background:radial-gradient(120% 95% at 50% 36%,var(--stage-1) 0%,var(--stage-2) 78%);container-type:inline-size;container-name:stage}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;cursor:grab;touch-action:none}
#gl:active{cursor:grabbing}
.brand{position:absolute;left:22px;top:18px;pointer-events:none;display:grid;gap:4px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(26px,3.1vw,40px);line-height:1.05;letter-spacing:.02em}
.brand h1 span{color:var(--wood-ink)}
.brand p{margin:0;font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.02em}
.brand p span{white-space:nowrap}
.toast{position:absolute;left:50%;top:20px;transform:translate(-50%,-6px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;padding:8px 18px;border-radius:999px;
  white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;transition:opacity .22s,transform .22s;
  box-shadow:0 6px 18px var(--shadow);z-index:3}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.hl{background:var(--accent);color:var(--on-accent)}
html[lang="en"] .toast{white-space:normal;width:max-content;text-align:center;border-radius:18px}   /* English toasts are longer: wrap instead of cutting off */
@container stage (max-width: 760px){ .toast{top:92px} }
.viewpad{position:absolute;left:14px;bottom:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vp{display:inline-flex;align-items:center;gap:2px;padding:3px 4px 3px 10px;border-radius:12px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.vp > span{font-size:12px;color:var(--muted);margin-right:4px;font-weight:500}
.vp button{width:32px;height:32px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;cursor:pointer}
.vp button:hover{background:var(--line)}
.vp button:focus-visible,.vp-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.vp svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.vp-btn{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);cursor:pointer;font-size:12.5px;font-weight:500;
  background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.vp-btn:hover{background:var(--panel)}
.vp-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gesture{position:absolute;right:16px;bottom:16px;margin:0;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);pointer-events:none;text-align:right}
@container stage (max-width: 700px){ .gesture{display:none} }
.nogl{position:absolute;inset:auto 22px 80px 22px;margin:0;color:var(--muted);font-size:13.5px}

.result{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:var(--scrim);z-index:4}
.result-card{width:min(410px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 22px 18px;box-shadow:0 18px 50px var(--shadow);display:grid;gap:10px}
.res-kicker{margin:0;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;color:var(--muted)}
.result-card h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.15}
.result-card h2.win{color:var(--accent)}
.res-score{margin:0;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.res-sub{margin:0;font-size:14px}
.name-form{display:grid;gap:8px;padding:12px;border-radius:12px;background:var(--accent-soft)}
.name-form label{font-size:13px;font-weight:700}
.name-row{display:flex;gap:8px}
.name-row input,.field input{flex:1;min-width:0;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);padding:0 12px}
.name-row input:focus-visible,.field input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.name-msg{margin:0;font-size:12.5px;color:var(--muted);min-height:1.2em}
.res-actions{display:grid;grid-template-columns:1fr 1.3fr;gap:10px;margin-top:4px}

/* ---------- side ---------- */
.side{min-width:0;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding-block:2px 8px;padding-inline:4px 6px}
.side h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.tabs button{height:42px;border:0;border-radius:10px;background:transparent;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tabs.small button{height:34px;font-size:13px}
.note{margin:0;font-size:12.5px;line-height:1.55;color:var(--muted)}
.note.pend{color:var(--gold);font-weight:700}

.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.player{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1.5px solid var(--line);transition:border-color .2s,box-shadow .2s}
.player.turn{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.disc{width:26px;height:26px;border-radius:50%;flex:none}
.disc.b{background:radial-gradient(circle at 34% 30%,var(--stone-b-hi),var(--stone-b) 64%)}
.disc.w{background:radial-gradient(circle at 34% 30%,var(--stone-w-hi),var(--stone-w) 72%);box-shadow:inset 0 0 0 1px var(--line)}
.pname{font-weight:700;font-size:15px;line-height:1.15}
.prole{font-size:12px;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.count{text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
.count b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px}
.count small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:2px}
.komi-note{margin:10px 0 0;padding:9px 12px;border-radius:12px;background:var(--accent-soft);font-size:12.5px;line-height:1.6;color:var(--ink)}
.komi-note b{font-family:var(--f-display);font-weight:400;font-size:15px;color:var(--ink);margin-right:8px;white-space:nowrap}
.kpill{display:inline-block;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;line-height:1.5;margin-right:3px}
/* English labels are longer: the captures line moves under the role so the role keeps its room */
html[lang="en"] .player{row-gap:3px}
html[lang="en"] .player .disc{grid-row:1 / 3}
html[lang="en"] .count{display:contents}
html[lang="en"] .count b{grid-column:3;grid-row:1;align-self:center;text-align:right}
html[lang="en"] .count small{grid-column:2 / 4;grid-row:2;text-align:left;margin-top:0;line-height:1.35}

.status{margin:8px 0 0;font-size:14.5px}
.status small{display:block;color:var(--muted);font-size:12.5px;font-family:var(--f-mono)}
.dots::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.playrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pending-champ{margin-top:10px;width:100%}

.settings{display:grid;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lbl{font-size:13.5px;font-weight:500}
.seg{display:inline-flex;flex-wrap:wrap;padding:3px;border-radius:10px;background:var(--panel);border:1px solid var(--line);position:relative}
.seg input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.seg label{padding:4px 10px;border-radius:7px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.seg input:checked + label{background:var(--ink);color:var(--bg)}
.seg input:focus-visible + label{outline:2px solid var(--accent);outline-offset:1px}
html[lang="en"] .seg label{padding:4px 8px}
.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.btn{height:42px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;padding:0 14px}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.ghost-btn{background:transparent;border:1.5px solid var(--line)}
.btn.ghost-btn:hover:not(:disabled){border-color:var(--ink)}
.btn.solid{background:var(--ink);color:var(--bg);border:0}
.btn.solid:hover:not(:disabled){opacity:.9}
.btn.solid.nudge{box-shadow:0 0 0 3px var(--accent-soft),0 0 0 5px var(--accent)}
.btn.accent{background:var(--accent);color:var(--on-accent);border:0}
.btn:disabled{opacity:.4;cursor:default}

.online{display:grid;gap:8px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.field{display:grid;gap:4px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.online .row-btns{display:grid;grid-template-columns:1fr auto;gap:8px}
.online-status{margin:0;font-size:13px}
.online-status b{color:var(--accent)}

/* flat map: in the side panel, under the game buttons. While a game is on, the settings fold away so it sits right under the score */
.mapsec{display:grid;gap:6px}
.map-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.mapsec .net{max-width:380px;justify-self:center}
.map-note{margin:0;font-size:12px;line-height:1.5;color:var(--muted)}
@media (min-width: 881px){ .mapsec .net{max-width:min(380px,max(240px,calc(100vh - 515px)))} }   /* on a short screen it shrinks to stay in view */
.side.playing:not(.show-set) .set-detail{display:none!important}
.set-toggle{display:none;align-items:center;gap:8px;justify-self:start;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--muted)}
.set-toggle:hover{border-color:var(--ink);color:var(--ink)}
.set-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.set-toggle::after{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg)}
.set-toggle[aria-expanded="true"]::after{transform:translateY(1px) rotate(-135deg)}
.side.playing .set-toggle{display:inline-flex}
.net{width:100%;height:auto;display:block;border-radius:6px;background:var(--wood);cursor:pointer;touch-action:manipulation}

.rules summary{cursor:pointer;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted);list-style:none;display:flex;align-items:center;gap:6px}
.rules summary::-webkit-details-marker{display:none}
.rules summary::before{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s}
.rules[open] summary::before{transform:rotate(45deg)}
.rules summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.rules ul{margin:8px 0 0;padding-left:1.1em;display:grid;gap:6px;font-size:13px;color:var(--muted)}
.rules li::marker{color:var(--accent)}
.rules b{color:var(--ink);font-weight:700}
.hall-link{font-size:13px;font-weight:700;color:var(--accent);text-decoration:none;align-self:flex-start}
.hall-link:hover{text-decoration:underline}

.hall{max-width:1080px;margin:0 auto;padding-block:28px 64px;padding-inline:16px;display:grid;gap:16px}
.hall-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hall-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(24px,3vw,34px);line-height:1.1}
.hall-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.hall-tabs{display:inline-flex;gap:6px;flex-wrap:wrap}
.hall-tabs button{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13px;cursor:pointer}
.hall-tabs button:hover{border-color:var(--ink)}
.hall-tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.hall-tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hall-tabs i{font-style:normal;font-family:var(--f-mono);font-size:11.5px;opacity:.75}
.hall-stats{display:flex;flex-wrap:wrap;gap:10px 28px;padding:14px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.stat{display:grid;gap:2px}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.hall-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.champ{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.champ .rank{grid-row:span 3;font-family:var(--f-mono);font-size:12px;color:var(--gold);padding-top:3px;min-width:2.2em}
.champ .nm{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.champ .meta{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.champ .rate{font-size:12.5px;color:var(--muted)}
.champ.me{border-color:var(--accent)}
.hall-empty{margin:0;padding:22px 18px;border-radius:14px;border:1px dashed var(--line);color:var(--muted);text-align:center;grid-column:1/-1}
.hall-note{margin:0;font-size:12.5px;color:var(--muted)}

@media (max-width: 880px){
  .app{height:auto;min-height:0;grid-template-columns:minmax(0,1fr)}
  .stage{height:62vh;height:min(62svh,620px);min-height:360px}
  .side{overflow:visible}
}
@media (max-width: 420px){ .seg label{padding:4px 8px} .home small{display:none} }
@media (prefers-reduced-motion: reduce){ .toast,.player{transition:none} .dots::after{animation:none;content:"…"} }
</style>
<script src="../config.js"></script>
</head>
<body>
<header class="sitebar">
  <a class="home" href="https://yataramath.github.io/" target="_top" id="homeLink">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
    <span data-en-html="Board Games from Another Dimension &lt;small&gt;all games&lt;/small&gt;">異次元のボードゲーム部屋 <small>ゲーム一覧</small></span>
  </a>
  <div class="bar-tools">
    <button type="button" class="tool lang-tool" id="langBtn" data-i18n-skip>EN</button>
    <button type="button" class="tool" id="soundBtn" aria-pressed="true" aria-label="効果音" title="効果音" data-en-attr="aria-label:Sound effects">

// (a classic script, so the page is in the right language before three.js has loaded; the game module below uses LANG, L, applyStaticLang)
const LANG_KEY = 'yatara:lang';
let LANG = (() => {
  try { const q = new URLSearchParams(location.search).get('lang'); if (q === 'en' || q === 'ja') return q; } catch (e) {}
  try { const s = (localStorage.getItem(LANG_KEY) || '').replace(/"/g, ''); if (s === 'en' || s === 'ja') return s; } catch (e) {}
  return /^ja\b/i.test(navigator.language || '') ? 'ja' : 'en';
})();

const L = (ja, en) => (LANG === 'en' ? en : ja);

function applyStaticLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-en],[data-en-html]').forEach(el => {
    if (el.dataset.ja == null) el.dataset.ja = el.innerHTML;          // remember the Japanese once
    const html = LANG === 'en' ? (el.dataset.enHtml != null ? el.dataset.enHtml : escHtml(el.dataset.en)) : el.dataset.ja;
    if (el.innerHTML !== html) el.innerHTML = html;
  });
  document.querySelectorAll('[data-en-attr]').forEach(el => {
    for (const part of el.dataset.enAttr.split(';')) {
      const k = part.indexOf(':'); if (k < 0) continue;
      const name = part.slice(0, k).trim(), keep = 'data-ja-' + name;
      if (!el.hasAttribute(keep)) el.setAttribute(keep, el.getAttribute(name) || '');
      el.setAttribute(name, LANG === 'en' ? part.slice(k + 1).trim() : el.getAttribute(keep));
    }
  });
  document.title = L('トーラス囲碁', 'Torus Go');
  const b = document.getElementById('langBtn');
  if (b) {

    b.setAttribute('aria-label', L('Switch to English', '日本語に切り替え')); b.title = L('Switch to English', '日本語に切り替え');
  }
}
applyStaticLang();
</script>

/* トーラス囲碁 engine — rules + Monte-Carlo tree search for an N × N board on a torus.
   T = 0: plain torus.  T = 1: twisted by one point (going once round the big ring shifts the small ring by one).
   Point index n = i + N j  (i: 大きい輪, j: 小さい輪).  Colours: 1 = black, 2 = white.
   Scoring: area (stones + empty regions touching only one colour), komi added to white.
   Self-contained: runs on the page's main thread for the rules and inside Web Workers for the CPU. */

  'use strict';

  const mod = (a, n) => ((a % n) + n) % n;
  const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());
  function step(k, di, dj) {
    let i = (k % N) + di, j = ((k / N) | 0) + dj;
    if (i >= N) { i -= N; j += T; } else if (i < 0) { i += N; j -= T; }
    return mod(j, N) * N + i;
  }
  const NB = new Int16Array(NN * 4), DG = new Int16Array(NN * 4);
  for (let k = 0; k < NN; k++) {
    NB[k * 4] = step(k, 1, 0); NB[k * 4 + 1] = step(k, -1, 0); NB[k * 4 + 2] = step(k, 0, 1); NB[k * 4 + 3] = step(k, 0, -1);
    DG[k * 4] = step(k, 1, 1); DG[k * 4 + 1] = step(k, -1, -1); DG[k * 4 + 2] = step(k, 1, -1); DG[k * 4 + 3] = step(k, -1, 1);

/* ================= sound ================= */
const Sound = (() => {
  let ctx = null, master = null, on = store.get('sound', true), resumedAt = 0;
  const bufs = { stone: [], capture: [], pass: [] };
  let loading = null;
  const decode = (c, ab) => new Promise((ok, ng) => { const p = c.decodeAudioData(ab, ok, ng); if (p && p.then) p.then(ok, ng); });
  // decode the recordings right away (an offline context needs no tap), so even the first stone sounds real
  try {
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (OAC && SOUNDS) {
      const oc = new OAC(1, 1, 44100);
      loading = Promise.all(Object.entries(SOUNDS).map(([k, list]) => Promise.all(list.map(async (u, i) => {
        try { bufs[k][i] = await decode(oc, await (await fetch(u)).arrayBuffer()); } catch (e) {}
      }))));
    }
  } catch (e) { loading = null; }
  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') { ctx.resume().catch(() => {}); resumedAt = performance.now(); }
    if (!loading && SOUNDS) loading = Promise.all(Object.entries(SOUNDS).map(([k, list]) => Promise.all(list.map(async (u, i) => {
      try { bufs[k][i] = await decode(ctx, await (await fetch(u)).arrayBuffer()); } catch (e) {}
    }))));
    return ctx;
  }
  // just after a tap the context may still be waking up (Safari): sounds scheduled then still play
  const ready = () => on && ctx && (ctx.state === 'running' || (ctx.state === 'suspended' && performance.now() - resumedAt < 1500));
  function playBuf(kind, delay = 0, gain = 1, idx = -1) {
    if (!ready()) return;
    const list = bufs[kind].filter(Boolean);
    if (!list.length) return synth(kind, delay);
    const src = ctx.createBufferSource(); src.buffer = idx >= 0 && list[idx] ? list[idx] : list[(Math.random() * list.length) | 0];
    const g = ctx.createGain(); g.gain.value = gain;
    src.connect(g).connect(master); src.start(ctx.currentTime + delay / 1000);
  }
  function synth(kind, delay) {     // fallback if the recordings could not be decoded
    const t = ctx.currentTime + delay / 1000, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(kind === 'pass' ? 330 : 1400, t); o.frequency.exponentialRampToValueAtTime(kind === 'pass' ? 260 : 700, t + 0.05);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    o.connect(g).connect(master); o.start(t); o.stop(t + 0.12);
  }
  function tone(t, f, dur, peak) {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  return {
    unlock: ensure,
    get on() { return on; },
    set on(v) { on = v; store.set('sound', v); if (v) ensure(); },
    stone(delay = 0) { playBuf('stone', delay, 1); },
    capture(n, delay = 0) { playBuf('capture', delay, Math.min(1, 0.6 + n * 0.1), Math.min(4, n - 1)); },
    pass() { playBuf('pass', 0, 0.9); },
    win() { if (!ready()) return; const t = ctx.currentTime; [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(t + i * 0.12, f, 1.1, 0.25)); },
    lose() { if (!ready()) return; const t = ctx.currentTime; [440, 349.23, 293.66].forEach((f, i) => tone(t + i * 0.2, f, 0.6, 0.22)); },
    draw() { if (!ready()) return; const t = ctx.currentTime; tone(t, 440, 0.4, 0.2); tone(t + 0.22, 440, 0.5, 0.2); }
  };
})();

/* ================= CPU: a pool of workers (最強 thinks on several threads at once and adds up their counts) ================= */
const AI = (() => {
  const HC = navigator.hardwareConcurrency || 2, K = HC >= 8 ? 6 : Math.max(1, Math.min(4, HC - 1));   // 最強 uses up to 6 threads
  const src = `${createGo.toString()}
const cache = {};
function eng(N, T, k) { const key = N + ':' + T + ':' + k; return cache[key] || (cache[key] = createGo(N, T, k)); }
self.onmessage = e => {
  const m = e.data, G = eng(m.N, m.T, m.komi);
  if (m.kind === 'own') { const own = G.ownership(m, m.n || 400); self.postMessage({ id: m.id, own: Array.from(own) }); return; }
  const res = G.think(m); res.id = m.id; self.postMessage(res);
};`;
  let url = null, workers = [], ok = true;
  try { url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' })); } catch (e) { ok = false; }
  function make() {
    const w = new Worker(url);
    w.busy = false;
    w.onerror = ev => { if (ev && ev.preventDefault) ev.preventDefault(); ok = false; };
    return w;
  }
  function pool(n) {
    if (!ok) return [];
    try { while (workers.length < n) workers.push(make()); } catch (e) { ok = false; return []; }
    return workers.slice(0, n);
  }
  let token = 0;
  function cancel() {
    token++;
    workers = workers.filter(w => { if (w.busy) { w.terminate(); return false; } return true; });
  }
  function local(req) { const G = eng(req.T, req.N); return req.kind === 'own' ? { own: Array.from(G.ownership(req, req.n || 400)) } : G.think(req); }
  function ask(req, threads, cb) {
    const my = ++token, ws = pool(threads);
    if (!ws.length) { setTimeout(() => { if (my === token) cb(local(req)); }, 30); return; }
    const out = [];
    ws.forEach((w, i) => {
      w.busy = true;
      w.onmessage = e => {
        w.busy = false;
        if (my !== token) return;
        out.push(e.data);
        if (out.length === ws.length) cb(mergeResults(out));
      };
      w.postMessage(Object.assign({}, req, { seed: (Math.random() * 0x7fffffff | 0) + i * 7919, id: my }));
    });
  }
  function mergeResults(list) {
    if (list[0].own) return list[0];
    if (list.some(r => r.reason === 'win-pass')) return { move: PASS, reason: 'win-pass' };
    const resign = list.every(r => r.resign);                       // every thread agrees it is hopeless
    const passOK = list.filter(r => r.passOK).length * 2 > list.length;   // most threads: passing is as good as playing on
    const tot = new Map(), skip = new Set();
    let playouts = 0;
    for (const r of list) {
      playouts += r.playouts || 0;
      for (const m of r.skip || []) skip.add(m);
      for (const [m, n, w] of r.stats || [[r.move, 1, 0]]) { const t = tot.get(m) || [0, 0]; t[0] += n; t[1] += w; tot.set(m, t); }
    }
    // most visited move, but not one inside an area that is already settled (then the next good one, or pass)
    const ranked = [...tot].sort((x, y) => y[1][0] - x[1][0]);
    const top = ranked[0][1][0];
    let best = [PASS, 0];
    for (const [m, [n, w]] of ranked) { if (n < 0.25 * top) break; if (m === PASS || !skip.has(m)) { best = [m, w / n]; break; } }
    return { move: passOK ? PASS : best[0], winrate: best[1], playouts, resign };
  }
  return { ask, cancel, threads: K };
})();

function schedulePoll(ms) {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    const g = G();
    if (!g.online || g.mode !== 'online' || g.online.status === 'over') return;
    try {
      const res = await fetch(`${RECORD_URL}${RECORD_URL.includes('?') ? '&' : '?'}type=room&key=${encodeURIComponent(g.online.key)}&device=${DEVICE}&t=${Date.now()}`);
      const j = await res.json();
      if (j.ok) syncRoom(j.room); else { setOnline(() => j.error ? escHtml(srvErr(j.error)) : ''); g.online.status = 'over'; refresh(); return; }
    } catch (e) {}
    const me = G();
    if (!me.online) return;
    schedulePoll(isRemoteTurn(me) || UI.busy ? 1500 : me.online.status === 'waiting' ? 2500 : 4000);
  }, ms);
}
async function sendRemote(move, over = false) {
  const g = G(), o = g.online; if (!o) return;
  const idx = g.moves.length - 1;      // our move is already on the board
  let sent = false;
  for (let tries = 0; tries < 5 && !sent; tries++) {
    try {
      const j = await api({ type: 'room_move', key: o.key, device: DEVICE, idx, move, over: !!over });
      if (G().online !== o) return;
      sent = true;
      if (j.ok) syncRoom(j.room);
      else if (j.conflict && j.room) { toast(L('局面を部屋に合わせ直します', 'Re-syncing the board with the room')); resyncRoom(o, j.room); }
      else if (j.error) toast(srvErr(j.error));
    } catch (e) {
      if (G().online !== o) return;
      toast(L('通信が不安定です。手を送り直しています…', 'Connection is unstable. Resending your move…'), '', 1400);
      await new Promise(r => setTimeout(r, 1500 * (tries + 1)));
    }
  }
  if (!sent) setOnline(() => L('手を送れませんでした。もう一度「部屋に入る」を押すと、部屋の局面に合わせ直します。', "Couldn't send your move. Press “Join room” again to re-sync with the room."));
  schedulePoll(800);
}
function resyncRoom(o, rv) {
  stopEverything();
  const g = games[gkey()] = freshGame(curT, curN, 'online', BLACK);
  g.online = { key: o.key, seat: rv.seat, status: rv.status, players: rv.players, applied: 0, room: o.room };
  V.sync(colorsOf(g.b), -1); V.setOwnership(null);
  syncRoom(rv);
}
async function leaveRoom(silent) {
  const g = G(); if (!g.online) return;
  clearTimeout(pollTimer);
  try { await api({ type: 'room_leave', key: g.online.key, device: DEVICE }); } catch (e) {}
  g.online = null;
  if (!silent) { setOnline(() => L('部屋を出ました。', 'You left the room.')); refresh(); }
}

/* ================= wiring ================= */
V.onTap = (p, type) => {
  if (type !== 'touch') { tryMove(p); return; }
  if (UI.sel === p) { UI.sel = -1; tryMove(p); return; }
  setHover(p); UI.sel = p;
  const g = G();
  if (!g.over && !UI.busy && !isCPUTurn(g) && !isRemoteTurn(g)) {
    if (legal(g, p)) toast(L(`${label(p)}：もう一度タップで打ちます${UI.preview.length ? `（${UI.preview.length}子取れます）` : ''}`, `${label(p)}: tap again to play${UI.preview.length ? ` (captures ${plural(UI.preview.length, 'stone', 'stones')})` : ''}`));
    else if (g.b.c[p]) toast(L(`${label(p)} にはもう石があります`, `There's already a stone on ${label(p)}`));
    else toast(L(`${label(p)} には打てません`, `You can't play on ${label(p)}`));
  }
};
V.onHover = p => setHover(p);
netEl.addEventListener('click', e => { const p = netPoint(e); if (p >= 0) tryMove(p); });
// while a game is on, the side shows the score, the flat map and the game buttons; the settings fold away
function paintSide() {
  const g = G(), side = document.querySelector('.side');
  const playing = !g.over && (g.moves.length > 0 || (g.mode === 'online' && !!g.online && g.online.status === 'playing'));
  if (playing && !UI.wasPlaying) side.classList.remove('show-set');   // each new game starts folded
  UI.wasPlaying = playing;
  side.classList.toggle('playing', playing);
  $('joinBtn').classList.toggle('set-detail', !(g.mode === 'online' && oppAway(g)));   // opponent gone: "Join room" stays at hand to start over
  const open = side.classList.contains('show-set'), b = $('setToggle');
  b.textContent = open ? L('設定をとじる', 'Hide settings') : L('対戦相手・盤の設定', 'Opponent & board settings');
  b.setAttribute('aria-expanded', String(open));
}
$('setToggle').addEventListener('click', () => { document.querySelector('.side').classList.toggle('show-set'); paintSide(); });
netEl.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') setHover(netPoint(e)); });
netEl.addEventListener('pointerleave', () => setHover(-1));
$('rollUp').addEventListener('click', () => V.roll(1)); $('rollDown').addEventListener('click', () => V.roll(-1));
$('spinL').addEventListener('click', () => V.spin(-1)); $('spinR').addEventListener('click', () => V.spin(1));
$('resetView').addEventListener('click', () => V.resetView());
$('showSpiral').addEventListener('click', () => { V.spiral(Math.floor(curN / 2) * curN + Math.floor(curN / 2)); toast(L(`横の線は${curN}周して${curN * curN}点を全部通り、元に戻ります`, `The horizontal line winds ${curN} times around through all ${curN * curN} points, then joins itself`), '', 4200); });
$('estBtn').addEventListener('click', () => {
  const g = G();
  if (UI.est) { UI.est = false; $('estBtn').setAttribute('aria-pressed', 'false'); V.setOwnership(g.over && g.result ? g.result.ownerArr : null, colorsOf(g.b)); return; }
  UI.est = true; $('estBtn').setAttribute('aria-pressed', 'true');
  const b = g.b, stones = []; for (let p = 0; p < b.c.length; p++) if (b.c[p]) stones.push([p, b.c[p]]);
  // 500 quick random games from here, on this thread (a few hundredths of a second)
  const own = Array.from(E().ownership({ stones, toMove: b.toMove, ko: b.ko, passes: 0, last: b.last, last2: b.last2, seed: 11 }, 500));
  V.setOwnership(own, colorsOf(b));
  let s = 0; for (const o of own) s += o > 0.3 ? 1 : o < -0.3 ? -1 : 0;
  const d = s - KOMI[curN];
  toast(L(`形勢の目安：${d > 0 ? '黒' : '白'}が${Math.abs(d).toFixed(1)}目ほどリード`, `Rough estimate: ${d > 0 ? 'Black' : 'White'} leads by about ${Math.abs(d).toFixed(1)} points`), 'hl', 3200);
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  const k = e.key.toLowerCase();
  if (k === 'w') V.roll(1); else if (k === 's') V.roll(-1); else if (k === 'a') V.spin(-1); else if (k === 'd') V.spin(1);
});
$('passBtn').addEventListener('click', pass);
$('resignBtn').addEventListener('click', resign);
$('undo').addEventListener('click', undo);
$('newGame').addEventListener('click', newGame);
$('tabTorus').addEventListener('click', () => switchBoard(0, curN)); $('tabTwist').addEventListener('click', () => switchBoard(1, curN));
$('size9').addEventListener('click', () => switchBoard(curT, 9)); $('size13').addEventListener('click', () => switchBoard(curT, 13));
document.querySelectorAll('input[name="mode"]').forEach(el => el.addEventListener('change', () => {
  const g = G();
  if (g.mode === 'online' && g.online && el.value !== 'online') leaveRoom(true);
  settings.mode = el.value; store.set('go:mode', settings.mode);
  if (el.value === 'online') { $('nickName').value = $('nickName').value || store.get('lastName', ''); if (g.mode !== 'online') { stopEverything(); } }
  applySettingsIfFresh();
}));
document.querySelectorAll('input[name="human"]').forEach(el => el.addEventListener('change', () => { settings.human = el.value === 'w' ? WHITE : BLACK; store.set('go:human', settings.human); applySettingsIfFresh(); }));
$('joinBtn').addEventListener('click', joinRoom);
$('leaveBtn').addEventListener('click', () => { leaveRoom(); });
$('resView').addEventListener('click', () => closeResult());
$('resAgain').addEventListener('click', () => newGame());
$('pendingChamp').addEventListener('click', () => { const g = G(); showResult(() => L('あなたの勝ち', 'You win!'), 'win', () => '', () => L('最強に勝ちました。名前を残せます。', 'You beat the Strongest! You can leave your name.')); });
$('nameForm').addEventListener('submit', submitName);
$('hallTabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { Rec.tab = b.dataset.v; renderHall(); } });
const soundBtn = $('soundBtn');
const paintSound = () => { soundBtn.setAttribute('aria-pressed', String(Sound.on)); soundBtn.title = Sound.on ? L('効果音：オン', 'Sound: on') : L('効果音：オフ', 'Sound: off'); };
soundBtn.addEventListener('click', () => { Sound.on = !Sound.on; paintSound(); if (Sound.on) setTimeout(() => Sound.stone(0), 40); });
paintSound();
const fsBtn = $('fsBtn');
if (!document.documentElement.requestFullscreen) fsBtn.hidden = true;
fsBtn.addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else document.documentElement.requestFullscreen().catch(() => toast(L('この画面では全画面にできません', "Full screen isn't available here"))); });
function setLang(l) {
  LANG = l; try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  applyStaticLang();
  paintSound(); paintNoGL(); paintOnline(); paintNameMsg(); paintResult();
  renderVariant(); refresh(); renderHall();
}
$('langBtn').addEventListener('click', () => setLang(LANG === 'en' ? 'ja' : 'en'));
window.addEventListener('pagehide', () => { const g = G(); if (g.online) navigator.sendBeacon && RECORD_URL && navigator.sendBeacon(RECORD_URL, JSON.stringify({ type: 'room_leave', key: g.online.key, device: DEVICE })); });

/* ================= boot ================= */
function start() {
  $({ pvp: 'modePvp', normal: 'modeNormal', good: 'modeGood', max: 'modeMax', online: 'modeOnline' }[settings.mode]).checked = true;
  $(settings.human === WHITE ? 'humanW' : 'humanB').checked = true;
  $('nickName').value = store.get('lastName', '');
  V.setBoard(curT, curN);
  const g = G(); V.sync(colorsOf(g.b), g.b.last);
  applyStaticLang(); paintOnline();
  renderVariant(); refresh(); renderHall(); loadHall(); nextTurn();
}
start();
</script>
