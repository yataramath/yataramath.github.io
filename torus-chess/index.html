<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ドーナツ型の盤で指すチェス。8×10のトーラスとねじれトーラス。CPUの最強に勝つと名前が残ります。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>トーラスチェス</title>
<script>document.documentElement.dataset.theme = 'dark';   // these games are always shown in their dark colors</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@500&family=Noto+Serif+JP:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one screen of play (3D stage left, scorecard + controls + flat map right), the hall of fame below on scroll; stacks on phones */
:root{
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-koma:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
}
:root{
  --bg:#0f1216; --stage-1:#1e252d; --stage-2:#0a0d11; --panel:#151a20;
  --ink:#e6eaef; --muted:#93a0ae; --line:#27303a;
  --accent:#4fb3ff; --accent-soft:#15304a; --on-accent:#03121f; --gold:#efc05c; --brand-ink:#e7c48f;
  --check:#e5484d; --grid:#1b130c; --sq-a:#e5d2ae; --sq-b:#9a7351; --last:rgb(242 193 78 / .42); --seam:#e5484d;
  --shadow:rgb(0 0 0 / .5); --scrim:rgb(9 12 16 / .74); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.65}
button,input{font:inherit;color:inherit}

/* site bar (same on every game page) */
.sitebar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:52px;padding-inline:16px;border-bottom:1px solid var(--line);background:var(--bg)}
.home{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:700;font-size:14px;min-width:0}
.home svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.home span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home small{font-weight:500;color:var(--muted)}
.home:hover span{text-decoration:underline}
.home:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
/* the English site name is long: on phones it takes two short lines instead of being cut off */
@media (max-width: 520px){ html[lang="en"] .home span{white-space:normal;line-height:1.2;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical} html[lang="en"] .home small{display:none} }
.bar-tools{display:flex;gap:8px;flex:none}
.app{height:calc(100vh - 52px);height:calc(100svh - 52px);min-height:600px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;padding-block:16px;padding-inline:16px}

/* ---------- stage ---------- */
.stage{position:relative;min-width:0;min-height:0;border-radius:20px;border:1px solid var(--line);overflow:hidden;
  background:radial-gradient(120% 95% at 50% 36%,var(--stage-1) 0%,var(--stage-2) 78%);container-type:inline-size;container-name:stage}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;cursor:grab;touch-action:none}
#gl:active{cursor:grabbing}
.brand{position:absolute;left:22px;top:18px;pointer-events:none;display:grid;gap:4px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(26px,3.1vw,40px);line-height:1.05;letter-spacing:.02em;text-wrap:balance}
.brand h1 span{color:var(--brand-ink)}
.brand p{margin:0;font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.02em}
.brand p span{white-space:nowrap}

.tool{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;background:var(--panel)}
.tool:hover{border-color:var(--ink)}
.tool:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tool svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool.lang-tool{width:auto;padding:0 11px;font-size:12.5px;font-weight:700}
.tool .off{display:none}
.tool[aria-pressed="false"] .on{display:none}
.tool[aria-pressed="false"] .off{display:inline}

.toast{position:absolute;left:50%;top:20px;transform:translate(-50%,-6px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;padding:8px 18px;border-radius:999px;
  white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;transition:opacity .22s,transform .22s;
  box-shadow:0 6px 18px var(--shadow);z-index:3}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.warn{background:var(--check);color:#fff}
html[lang="en"] .toast{white-space:normal;width:max-content;text-align:center;line-height:1.4;border-radius:18px}
@container stage (max-width: 760px){ .toast{top:92px;max-width:calc(100% - 32px)} }

.viewpad{position:absolute;left:14px;bottom:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vp{display:inline-flex;align-items:center;gap:2px;padding:3px 4px 3px 10px;border-radius:12px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.vp > span{font-size:12px;color:var(--muted);margin-right:4px;font-weight:500}
.vp button{width:32px;height:32px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;cursor:pointer}
.vp button:hover{background:var(--line)}
.vp button:focus-visible,.vp-reset:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.vp svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.vp-reset{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);cursor:pointer;font-size:12.5px;font-weight:500;
  background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.vp-reset:hover{background:var(--panel)}
.gesture{position:absolute;right:16px;bottom:16px;margin:0;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);pointer-events:none;text-align:right}
@container stage (max-width: 640px){ .gesture{display:none} }
.nogl{position:absolute;inset:auto 22px 80px 22px;margin:0;color:var(--muted);font-size:13.5px}

/* result card + promotion choice (both float over the stage) */
.result,.promo{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:var(--scrim);z-index:4}
.result-card,.promo-card{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 22px 18px;
  box-shadow:0 18px 50px var(--shadow);display:grid;gap:10px}
.res-kicker{margin:0;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;color:var(--muted)}
.result-card h2,.promo-card h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.15;text-wrap:balance}
.promo-card h2{font-size:22px}
.result-card h2.win{color:var(--brand-ink)}
.res-score{margin:0;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.res-sub{margin:0;font-size:14px}
.name-form{display:grid;gap:8px;padding:12px;border-radius:12px;background:var(--accent-soft)}
.name-form label{font-size:13px;font-weight:700}
.name-row{display:flex;gap:8px}
.name-row input,.field input{flex:1;min-width:0;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);padding:0 12px}
.name-row input:focus-visible,.field input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.name-msg{margin:0;font-size:12.5px;color:var(--muted);min-height:1.2em}
.res-actions{display:grid;grid-template-columns:1fr 1.3fr;gap:10px;margin-top:4px}
.promo-opts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
.promo-opts button{display:grid;justify-items:center;gap:4px;padding:10px 6px 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:13px;font-weight:700}
.promo-opts button:hover{border-color:var(--accent)}
.promo-opts button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.promo-opts .pc{width:52px;height:52px}

/* ---------- side ---------- */
.side{min-width:0;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding-block:2px 8px;padding-inline:4px 6px}
.side h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted)}

.variant{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.variant button{height:44px;border:0;border-radius:10px;background:transparent;cursor:pointer;font-weight:700;font-size:14.5px;color:var(--muted)}
.variant button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.variant button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.variant-note{margin:-10px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55}

.players{display:grid;gap:8px}
.player{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px 10px;padding:9px 12px;border-radius:14px;
  background:var(--panel);border:1.5px solid var(--line);transition:border-color .2s,box-shadow .2s}
.player.turn{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.player.checked{border-color:var(--check);box-shadow:0 0 0 3px color-mix(in srgb,var(--check) 30%,transparent)}
.side-mark{width:28px;height:28px;flex:none;display:grid;place-items:center}
.side-mark .pc{width:28px;height:28px}
.pname{font-weight:700;font-size:15px;line-height:1.15}
.prole{font-size:12px;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.ptag{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap}
.ptag b{color:var(--check);font-family:var(--f-body)}
.hand{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;min-height:30px;align-items:center}
.hand:empty::before{content:attr(data-empty);font-size:12px;color:var(--muted)}
.hand button,.hand span.cap{position:relative;display:inline-grid;place-items:center;width:30px;height:30px;padding:0;border-radius:8px;border:1.5px solid transparent;background:transparent}
.hand button{cursor:pointer}
.hand button:hover:not(:disabled){border-color:var(--line)}
.hand button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.hand button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hand button:disabled{cursor:default}
.hand .pc{width:26px;height:26px}
.hand i{position:absolute;right:-3px;bottom:-4px;font-style:normal;font-family:var(--f-mono);font-size:10.5px;font-weight:500;background:var(--ink);color:var(--bg);border-radius:99px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 3px}
.status{margin:8px 0 0;font-size:14.5px}
.status small{display:block;color:var(--muted);font-size:12.5px;font-family:var(--f-mono)}
.status .chk{color:var(--check)}
.dots::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.pending-champ{margin-top:10px;width:100%}

.settings{display:grid;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lbl{font-size:13.5px;font-weight:500}
.seg{display:inline-grid;grid-auto-flow:column;padding:3px;border-radius:10px;background:var(--panel);border:1px solid var(--line);position:relative}
.seg input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.seg label{padding:4px 11px;border-radius:7px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.seg input:checked + label{background:var(--ink);color:var(--bg)}
.seg input:focus-visible + label{outline:2px solid var(--accent);outline-offset:1px}
.seg input:disabled + label{opacity:.4;cursor:default}
.note{margin:-4px 0 2px;font-size:12px;line-height:1.55;color:var(--muted)}
.note.pend{color:var(--gold);font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;margin-top:2px}
.btn{height:42px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;padding:0 12px}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.ghost-btn{background:transparent;border:1.5px solid var(--line)}
.btn.ghost-btn:hover:not(:disabled){border-color:var(--ink)}
.btn.ghost-btn.armed{border-color:var(--check);color:var(--check)}
.btn.solid{background:var(--ink);color:var(--bg);border:0}
.btn.solid:hover{opacity:.9}
.btn.solid.nudge{box-shadow:0 0 0 3px var(--accent-soft),0 0 0 5px var(--accent)}
.btn.accent{background:var(--accent);color:var(--on-accent);border:0}
.btn:disabled{opacity:.4;cursor:default}

.online{display:grid;gap:8px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.field{display:grid;gap:4px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.online .row-btns{display:grid;grid-template-columns:1fr auto;gap:8px}
.online-status{margin:0;font-size:13px}
.online-status b{color:var(--accent)}

/* flat map: in the side panel. While a game is on, the settings fold away so it sits right under the score */
.mapsec{display:grid;gap:6px}
.map-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.mapsec .net{justify-self:center}
.map-note{margin:0;font-size:12px;line-height:1.5;color:var(--muted)}
.side.playing:not(.show-set) .set-detail{display:none!important}
.set-toggle{display:none;align-items:center;gap:8px;justify-self:start;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--muted)}
.set-toggle:hover{border-color:var(--ink);color:var(--ink)}
.set-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.set-toggle::after{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg)}
.set-toggle[aria-expanded="true"]::after{transform:translateY(1px) rotate(-135deg)}
.side.playing .set-toggle{display:inline-flex}
.net{display:grid;gap:1px;background:var(--grid);border:1.5px solid var(--grid);border-radius:5px;overflow:hidden;width:100%;touch-action:manipulation;position:relative}
.cell,.ghost{position:relative;background:var(--sq-a);display:grid;place-items:center;overflow:hidden;min-width:0;min-height:0;padding:0;border:0}
.cell.b,.ghost.b{background:var(--sq-b)}
.cell{cursor:pointer}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;z-index:2}
.ghost{opacity:.42;cursor:pointer}
.cell > .pc,.ghost > .pc{width:88%;height:88%;pointer-events:none;position:relative;z-index:1}
.cell.lastf::before,.ghost.lastf::before,.cell.lastt::before,.ghost.lastt::before{content:"";position:absolute;inset:0;background:var(--last)}
.cell.hover,.ghost.hover{box-shadow:inset 0 0 0 2px var(--accent)}
.cell.sel,.ghost.sel{box-shadow:inset 0 0 0 3px var(--accent);background:color-mix(in srgb,var(--accent) 34%,var(--sq-a))}
.cell.b.sel,.ghost.b.sel{background:color-mix(in srgb,var(--accent) 34%,var(--sq-b))}
.cell.dest::after,.ghost.dest::after{content:"";position:absolute;width:30%;aspect-ratio:1;border-radius:50%;background:var(--accent);opacity:.9;z-index:2}
.cell.cap::after,.ghost.cap::after{content:"";position:absolute;inset:6%;border-radius:50%;border:3px solid var(--accent);z-index:2}
.cell.chk::before,.ghost.chk::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,color-mix(in srgb,var(--check) 85%,transparent) 0 40%,transparent 72%)}
.net-frame{pointer-events:none;z-index:3;border-radius:2px;box-shadow:0 0 0 2px var(--accent)}
.net-seam{pointer-events:none;z-index:4;height:4px;align-self:center;background:var(--seam);border-radius:2px;box-shadow:0 0 0 1px rgb(0 0 0 / .35)}
.net-seam.top{align-self:start;margin-top:-2.5px}
.net-seam.bot{align-self:end;margin-bottom:-2.5px}

.rules summary{cursor:pointer;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted);list-style:none;display:flex;align-items:center;gap:6px}
.rules summary::-webkit-details-marker{display:none}
.rules summary::before{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s}
.rules[open] summary::before{transform:rotate(45deg)}
.rules summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.rules ul{margin:8px 0 0;padding-left:1.1em;display:grid;gap:6px;font-size:13px;color:var(--muted)}
.rules li::marker{color:var(--accent)}
.rules b{color:var(--ink);font-weight:700}
.rules a{color:var(--brand-ink)}
.hall-link{font-size:13px;font-weight:700;color:var(--brand-ink);text-decoration:none;align-self:flex-start}
.hall-link:hover{text-decoration:underline}

/* ---------- hall of fame ---------- */
.hall{max-width:1080px;margin:0 auto;padding-block:28px 64px;padding-inline:16px;display:grid;gap:16px}
.hall-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(24px,3vw,34px);line-height:1.1}
.hall-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.hall-stats{display:flex;flex-wrap:wrap;gap:10px 28px;padding:14px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.stat{display:grid;gap:2px}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.hall-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.champ{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.champ .rank{grid-row:span 3;font-family:var(--f-mono);font-size:12px;color:var(--gold);padding-top:3px;min-width:2.2em}
.champ .nm{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.champ .vt{display:inline-block;margin-left:8px;padding:0 8px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:11.5px;font-weight:700;vertical-align:2px}
.champ .meta{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.champ .rate{font-size:12.5px;color:var(--muted)}
.champ.me{border-color:var(--accent)}
.hall-empty{margin:0;padding:22px 18px;border-radius:14px;border:1px dashed var(--line);color:var(--muted);text-align:center;grid-column:1/-1}
.hall-note{margin:0;font-size:12.5px;color:var(--muted)}

@media (max-width: 880px){
  .app{height:auto;min-height:0;grid-template-columns:minmax(0,1fr)}
  .stage{height:62vh;height:min(62svh,620px);min-height:360px}
  .side{overflow:visible}
}
@media (max-width: 420px){
  .home small{display:none}
  .seg label{padding:4px 9px}
  .actions{grid-template-columns:1fr 1fr}
  .actions .solid{grid-column:1/-1}
}
@media (prefers-reduced-motion: reduce){
  .toast,.player{transition:none}
  .dots::after{animation:none;content:"…"}
}
</style>
<script src="../config.js"></script>

</head>
<body>
<header class="sitebar">
  <a class="home" href="https://yataramath.github.io/" target="_top">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
    <span data-en-html="Board Games from Another Dimension <small>all games</small>">異次元のボードゲーム部屋 <small>ゲーム一覧</small></span>
  </a>
  <div class="bar-tools">

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

function createChess(T) {
  'use strict';
  // Torus chess: 8 x 10 board that wraps both ways. T = 1 (twisted): crossing the right edge goes one row
  // down, crossing the left edge one row up. Both armies face +y. Pawns never promote; they walk round forever.
  T = T ? 1 : 0;
  const W = 8, H = 10, NN = 80;
  const now = (typeof performance !== 'undefined' && performance && typeof performance.now === 'function')
    ? function () { return performance.now(); }
    : function () { return Date.now(); };

  // ---------------------------------------------------------------- geometry
  function wrapXY(x, y) {
    const q = Math.floor(x / W);
    x -= q * W;
    y = (y - q * T) % H;
    if (y < 0) y += H;
    return y * W + x;
  }

  const DX = [1, -1, 0, 0, 1, 1, -1, -1];          // 0..3 orthogonal, 4..7 diagonal
  const DY = [0, 0, 1, -1, 1, -1, 1, -1];
  const NX = [1, 2, 2, 1, -1, -2, -2, -1];
  const NY = [2, 1, -1, -2, -2, -1, 1, 2];
  const STEP = new Uint8Array(8 * NN);              // STEP[d*NN+k]
  const KN = new Uint8Array(8 * NN);                // KN[k*8+i] knight targets
  const PUSH = new Uint8Array(NN);                  // one step forward (+y), both colours
  const PCAP = new Uint8Array(2 * NN);              // pawn capture targets of a pawn on k
  const PFROM = new Uint8Array(2 * NN);             // squares from which a pawn attacks k
  const REL = new Uint8Array(2 * NN);               // relative row: REL[k] white, REL[NN+k] black
  const NEAR = new Uint8Array(NN * NN);             // NEAR[a*NN+b] = 1 if b is a or next to a
  const ROFF = new Int32Array(8 * NN), REND = new Int32Array(8 * NN);
  for (let k = 0; k < NN; k++) {
    const x = k % W, y = (k / W) | 0;
    for (let d = 0; d < 8; d++) {
      STEP[d * NN + k] = wrapXY(x + DX[d], y + DY[d]);
      KN[k * 8 + d] = wrapXY(x + NX[d], y + NY[d]);
    }
    PUSH[k] = wrapXY(x, y + 1);
    PCAP[2 * k] = wrapXY(x - 1, y + 1);
    PCAP[2 * k + 1] = wrapXY(x + 1, y + 1);
    PFROM[2 * k] = wrapXY(x + 1, y - 1);
    PFROM[2 * k + 1] = wrapXY(x - 1, y - 1);
    REL[k] = y;
    REL[NN + k] = (y + 5) % H;
  }
  const rayList = [];
  for (let d = 0; d < 8; d++) {
    for (let k = 0; k < NN; k++) {
      ROFF[d * NN + k] = rayList.length;
      let s = k;
      for (let n = 0; n < NN; n++) {             // a ray ends when it comes back to its start
        s = STEP[d * NN + s];
        if (s === k) break;
        rayList.push(s);
      }
      REND[d * NN + k] = rayList.length;
    }
  }
  const RAYS = Uint8Array.from(rayList);
  for (let k = 0; k < NN; k++) {
    NEAR[k * NN + k] = 1;
    for (let d = 0; d < 8; d++) NEAR[k * NN + STEP[d * NN + k]] = 1;
  }
  const KDIST = new Uint8Array(NN * NN);            // king-move distance on the torus
  for (let a = 0; a < NN; a++) {
    const o = a * NN, q = [a];
    KDIST.fill(255, o, o + NN); KDIST[o + a] = 0;
    for (let h = 0; h < q.length; h++) {
      const k = q[h];
      for (let d = 0; d < 8; d++) { const s = STEP[d * NN + k]; if (KDIST[o + s] === 255) { KDIST[o + s] = KDIST[o + k] + 1; q.push(s); } }
    }
  }

  // ---------------------------------------------------------------- hashing
  let zs = 0x2545F491;                              // fixed seed: keys stay stable between sessions
  function zr() { zs ^= zs << 13; zs ^= zs >>> 17; zs ^= zs << 5; return zs | 0; }
  const ZL = new Int32Array(13 * NN), ZH = new Int32Array(13 * NN);
  for (let i = 0; i < 13 * NN; i++) { ZL[i] = zr(); ZH[i] = zr(); }
  const ZRL = new Int32Array(20), ZRH = new Int32Array(20);
  for (let i = 0; i < 20; i++) { ZRL[i] = zr(); ZRH[i] = zr(); }
  const ZSL = zr(), ZSH = zr();
  const M21 = 0x1FFFFF;
  function key53(lo, hi) { return (hi & M21) * 4294967296 + (lo >>> 0); }

  // Rights word: bits 0..3 castling (1 white O-O, 2 white O-O-O, 4 black O-O, 8 black O-O-O),
  // bits 4..11 unmoved white pawn on (x,1), bits 12..19 unmoved black pawn on (x,6).
  const RMASK = new Int32Array(NN).fill(0xFFFFF);
  RMASK[4] &= ~3; RMASK[0] &= ~2; RMASK[7] &= ~1;
  RMASK[44] &= ~12; RMASK[40] &= ~8; RMASK[47] &= ~4;
  const DBL = new Int32Array(2 * NN);               // double-step right of a white (k) / black (NN+k) pawn
  for (let x = 0; x < 8; x++) {
    RMASK[8 + x] &= ~(1 << (4 + x)); DBL[8 + x] = 1 << (4 + x);
    RMASK[48 + x] &= ~(1 << (12 + x)); DBL[NN + 48 + x] = 1 << (12 + x);
  }

  // ---------------------------------------------------------------- board state (internal)
  const bd = new Int8Array(NN);
  const cnt = new Int32Array(13);                   // piece counts, index code + 6
  let stm = 1, rt = 0, hm = 0, hLo = 0, hHi = 0, kW = 0, kB = 0, gply = 0;
  const MAXPLY = 100;
  const US = MAXPLY + 16;
  const U_CAP = new Int8Array(US), U_RT = new Int32Array(US), U_HM = new Int32Array(US);
  const U_LO = new Int32Array(US), U_HI = new Int32Array(US), U_MV = new Int32Array(US);
  let sp = 0;
  const HL = new Int32Array(1024), HH = new Int32Array(1024);   // position keys: game + search path
  let hp = 0;
  const CF = 1 << 14;                               // internal move: from | to << 7 | castle flag

  function fullHash() {
    let lo = 0, hi = 0;
    for (let k = 0; k < NN; k++) {
      const p = bd[k];
      if (p !== 0) { lo ^= ZL[(p + 6) * NN + k]; hi ^= ZH[(p + 6) * NN + k]; }
    }
    for (let b = 0; b < 20; b++) if (rt & (1 << b)) { lo ^= ZRL[b]; hi ^= ZRH[b]; }
    if (stm < 0) { lo ^= ZSL; hi ^= ZSH; }
    hLo = lo; hHi = hi;
  }

  function mk(m) {
    const from = m & 127, to = (m >> 7) & 127, p = bd[from], cap = bd[to];
    U_CAP[sp] = cap; U_RT[sp] = rt; U_HM[sp] = hm; U_LO[sp] = hLo; U_HI[sp] = hHi; U_MV[sp] = m; sp++;
    const pi = (p + 6) * NN;
    let lo = hLo ^ ZL[pi + from] ^ ZL[pi + to] ^ ZSL;
    let hi = hHi ^ ZH[pi + from] ^ ZH[pi + to] ^ ZSH;
    if (cap !== 0) {
      lo ^= ZL[(cap + 6) * NN + to]; hi ^= ZH[(cap + 6) * NN + to];
      cnt[cap + 6]--; hm = 0;
    } else if (p === 1 || p === -1) hm = 0;
    else hm++;
    bd[from] = 0; bd[to] = p;
    if (p === 6) kW = to; else if (p === -6) kB = to;
    if (m & CF) {
      const rf = to > from ? from + 3 : from - 4, rto = to > from ? from + 1 : from - 1, r = bd[rf];
      bd[rf] = 0; bd[rto] = r;
      const ri = (r + 6) * NN;
      lo ^= ZL[ri + rf] ^ ZL[ri + rto]; hi ^= ZH[ri + rf] ^ ZH[ri + rto];
    }
    const nr = rt & RMASK[from] & RMASK[to];
    if (nr !== rt) {
      let d = nr ^ rt;
      while (d !== 0) { const b = 31 - Math.clz32(d & -d); lo ^= ZRL[b]; hi ^= ZRH[b]; d &= d - 1; }
      rt = nr;
    }
    hLo = lo; hHi = hi; stm = -stm;
    hp++; HL[hp] = lo; HH[hp] = hi & M21;
  }

  function unmk() {
    sp--;
    const m = U_MV[sp], from = m & 127, to = (m >> 7) & 127, p = bd[to], cap = U_CAP[sp];
    bd[from] = p; bd[to] = cap;
    if (cap !== 0) cnt[cap + 6]++;
    if (p === 6) kW = from; else if (p === -6) kB = from;
    if (m & CF) {
      const rf = to > from ? from + 3 : from - 4, rto = to > from ? from + 1 : from - 1;
      bd[rf] = bd[rto]; bd[rto] = 0;
    }
    rt = U_RT[sp]; hm = U_HM[sp]; hLo = U_LO[sp]; hHi = U_HI[sp]; stm = -stm; hp--;
  }

  function mkNull() {
    U_CAP[sp] = 0; U_RT[sp] = rt; U_HM[sp] = hm; U_LO[sp] = hLo; U_HI[sp] = hHi; U_MV[sp] = 0; sp++;
    hLo ^= ZSL; hHi ^= ZSH; stm = -stm; hm = 0;
    hp++; HL[hp] = hLo; HH[hp] = hHi & M21;
  }
  function unmkNull() {
    sp--; hm = U_HM[sp]; hLo = U_LO[sp]; hHi = U_HI[sp]; stm = -stm; hp--;
  }

  // Is square k attacked by colour `by`?
  function attacked(k, by) {
    if (bd[PFROM[2 * k]] === by || bd[PFROM[2 * k + 1]] === by) return true;
    const n = 2 * by;
    if (cnt[n + 6] !== 0) {
      const o = k * 8;
      for (let i = 0; i < 8; i++) if (bd[KN[o + i]] === n) return true;
    }
    const kg = 6 * by;
    for (let d = 0; d < 8; d++) if (bd[STEP[d * NN + k]] === kg) return true;
    const q = 5 * by, r = 4 * by, b = 3 * by, nq = cnt[q + 6];
    if (nq + cnt[r + 6] !== 0) {
      for (let d = 0; d < 4; d++) {
        const ix = d * NN + k, e = REND[ix];
        for (let i = ROFF[ix]; i < e; i++) {
          const p = bd[RAYS[i]];
          if (p !== 0) { if (p === r || p === q) return true; break; }
        }
      }
    }
    if (nq + cnt[b + 6] !== 0) {
      for (let d = 4; d < 8; d++) {
        const ix = d * NN + k, e = REND[ix];
        for (let i = ROFF[ix]; i < e; i++) {
          const p = bd[RAYS[i]];
          if (p !== 0) { if (p === b || p === q) return true; break; }
        }
      }
    }
    return false;
  }
  function sideInCheck() { return stm > 0 ? attacked(kW, -1) : attacked(kB, 1); }
  function moverInCheck() { return stm > 0 ? attacked(kB, 1) : attacked(kW, -1); }

  // the rule: K v K, K+N v K, K+B v K
  function insufficient() {
    if (cnt[7] + cnt[5] + cnt[10] + cnt[2] + cnt[11] + cnt[1] !== 0) return false;   // P, R, Q
    return cnt[8] + cnt[4] + cnt[9] + cnt[3] <= 1;                                   // one minor at most
  }
  // Search only: a bare king against material that can never mate (retrograde check of all placements).
  // Plain torus: one piece, or two of {R+N, R+P, B+N, B+P, N+N, N+P, P+P}. Twisted: none, one N/P, or two of N/P.
  function deadDraw() {
    const wn = cnt[7] + cnt[8] + cnt[9] + cnt[10] + cnt[11], bn = cnt[5] + cnt[4] + cnt[3] + cnt[2] + cnt[1];
    if (wn !== 0 && bn !== 0) return false;
    const n = wn + bn;
    if (n === 0) return true;
    if (n > 2) return false;
    const q = cnt[11] + cnt[1], r = cnt[10] + cnt[2], b = cnt[9] + cnt[3];

    let castle = null;

      castle = to > from ? { rookFrom: from + 3, rookTo: from + 1 } : { rookFrom: from - 4, rookTo: from - 1 };
    }
    mk(im);
    const check = sideInCheck();
    unmk();
    return { from: from, to: to, piece: piece, captured: captured, promo: 0, drop: 0, castle: castle, check: check };
  }

  // perft with internal make/unmake; verify = true also checks the incremental state at every node
  function perft(pos, depth, verify) {
    loadPos(pos, false);
    return perftRec(depth, 0, !!verify);
  }
  function perftRec(depth, base, verify) {
    if (verify) checkState();
    if (depth === 0) return 1;
    const end = gen(base, true);
    if (verify) {
      const seen = {};
      for (let i = base; i < end; i++) { if (seen[ML[i]]) throw new Error('duplicate move'); seen[ML[i]] = 1; }
    }
    let n = 0;
    for (let i = base; i < end; i++) {
      mk(ML[i]);
      if (!moverInCheck()) n += (depth === 1 && !verify) ? 1 : perftRec(depth - 1, end, verify);
      unmk();
    }
    return n;
  }
  function checkState() {
    const lo = hLo, hi = hHi;
    fullHash();
    if (lo !== hLo || hi !== hHi) throw new Error('hash mismatch');
    const c = new Int32Array(13);
    for (let k = 0; k < NN; k++) if (bd[k] !== 0) c[bd[k] + 6]++;
    for (let i = 0; i < 13; i++) if (c[i] !== cnt[i]) throw new Error('count mismatch');
    if (bd[kW] !== 6 || bd[kB] !== -6) throw new Error('king square mismatch');
  }

  function key(pos) {
    loadPos(pos, false);
    return key53(hLo, hHi);
  }

  return {
    W: W, H: H, NN: NN, T: T,
    wrapXY: wrapXY, initial: initial, legalMoves: legalMoves, isLegal: isLegal, play: play,
    inCheck: inCheck, result: result, info: info, think: think,
    encodePos: encodePos, decodePos: decodePos, perft: perft, key: key
  };
}

const escHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const esc = escHtml;
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
function applyStaticLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-en],[data-en-html]').forEach(el => {
    if (el.dataset.ja == null) el.dataset.ja = el.innerHTML;          // remember the Japanese once
    el.innerHTML = LANG === 'en' ? (el.dataset.enHtml != null ? el.dataset.enHtml : escHtml(el.dataset.en)) : el.dataset.ja;
  });
  document.querySelectorAll('[data-en-attr]').forEach(el => {
    for (const pair of el.dataset.enAttr.split(';')) {
      const at = pair.indexOf(':'); if (at < 0) continue;
      const name = pair.slice(0, at).trim(), en = pair.slice(at + 1).trim(), keep = 'ja-' + name;
      if (el.getAttribute('data-' + keep) == null) el.setAttribute('data-' + keep, el.getAttribute(name) || '');
      el.setAttribute(name, LANG === 'en' ? en : el.getAttribute('data-' + keep));
    }
  });
  document.title = L(GAME.title[0], GAME.title[1]);
  const lb = document.getElementById('langBtn');
  if (lb) {
    lb.textContent = LANG === 'en' ? '日本語' : 'EN';
    lb.lang = LANG === 'en' ? 'ja' : 'en';
    const t = LANG === 'en' ? '日本語に切り替え' : 'Switch to English';
    lb.setAttribute('aria-label', t); lb.title = t;
  }
}
// the record keeper answers in Japanese
function srvErr(s) {
  if (LANG !== 'en') return s;
  s = String(s || '');
  if (/満員/.test(s)) return 'This room is full. Please choose another room name.';
  if (/勝った対局が見つかりません/.test(s)) return "Couldn't find your winning game.";   // before the room check (both say 見つかりません)
  if (/見つかりません/.test(s)) return 'Room not found (rooms disappear after 6 hours of no activity).';
  if (/対局者ではありません/.test(s)) return 'You are not a player in this room.';
  if (/まだ対局が始まっていません/.test(s)) return "The game hasn't started yet.";
  if (/部屋の名前/.test(s)) return 'Please enter a room name.';
  if (/名前を入力/.test(s)) return 'Please enter a name.';
  if (/もう名前を登録/.test(s)) return 'A name is already registered for this game.';
  if (/棋譜を確かめられません/.test(s)) return "Couldn't verify the game record.";
  return 'Something went wrong. Please try again.';
}
applyStaticLang();

/* ================= CPU in a worker ================= */
function makeAI() {
  let worker = null, handler = null, pending = null, pondering = false, source = null;
  const runLocal = req => setTimeout(() => { const res = RULES[req.T].think(req); res.id = req.id; if (handler) handler(res); }, 30);
  /* pondering: while the human thinks against the strongest level, the worker keeps searching the current
     position in short slices; the answers are thrown away, but the transposition table keeps what it learnt */
  function ponderNext() {
    if (!worker || pending || pondering || !source) return;
    const p = source();
    if (!p) return;
    pondering = true;
    worker.postMessage({ id: -1, T: p.T, pos: p.pos, level: 'max', time: 400, ponder: true });
  }
  try {
    const src = `${GAME.engineSource}
const engines = {};
function eng(T) { return engines[T] || (engines[T] = ${GAME.engineName}(T)); }
self.onmessage = e => { const m = e.data; const res = eng(m.T).think(m); res.id = m.id; self.postMessage(m.ponder ? { id: -1 } : res); };`;
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    worker.onmessage = e => {
      if (e.data.id === -1) { pondering = false; ponderNext(); return; }
      pending = null; if (handler) handler(e.data);
    };
    worker.onerror = ev => { if (ev && ev.preventDefault) ev.preventDefault(); worker = null; if (pending) runLocal(pending); pending = null; };
  } catch (e) { worker = null; }
  return {
    ask(req, cb) { handler = cb; if (worker) { pending = req; worker.postMessage(req); } else runLocal(req); },
    /* fn() → { T, pos } to ponder on, or null */
    ponderWith(fn) { source = fn; },
    kick() { ponderNext(); },
  };
}

function toast(msg, kind = '', ms = 1800) {
  toastEl.textContent = msg;
  toastEl.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(toastTimer);
  if (ms > 0) toastTimer = setTimeout(() => { toastEl.className = 'toast' + (kind ? ' ' + kind : ''); }, ms);
}
function hideToast() { clearTimeout(toastTimer); toastEl.className = 'toast'; }

function kingSquare(pos, c) { for (let k = 0; k < NN; k++) if (pos.board[k] === GAME.KING * c) return k; return -1; }
function markState() {
  const g = G(), sel = UI.sel;
  const dests = [];
  if (sel && settings.hints) for (const [k] of UI.targets) dests.push({ k, cap: !!g.pos.board[k] });
  const chk = !g.over || (g.res && g.res.reason === 'mate') ? (RULES[cur].inCheck(g.pos) ? kingSquare(g.pos, g.pos.turn) : -1) : -1;
  return { sel: sel && sel.from >= 0 ? sel.from : -1, dests, lastf: g.last ? g.last.from : -1, lastt: g.last ? g.last.to : -1, chk };
}
function renderNet(ms) {
  const g = G(), b = g.pos.board, destSet = new Map(ms.dests.map(d => [d.k, d.cap]));
  for (const s of netSlots) {
    const k = s.k, el = s.el, code = b[k];
    if (s.pcCode !== code) { el.innerHTML = code ? GAME.piece2D(code, netView) : ''; s.pcCode = code; }
    el.classList.toggle('sel', k === ms.sel);
    el.classList.toggle('dest', destSet.has(k) && !destSet.get(k));
    el.classList.toggle('cap', destSet.has(k) && destSet.get(k));
    el.classList.toggle('lastf', k === ms.lastf);
    el.classList.toggle('lastt', k === ms.lastt);
    el.classList.toggle('chk', k === ms.chk);
    el.classList.toggle('hover', k === UI.hover);
    if (!s.ghost) el.setAttribute('aria-label', `${GAME.squareName(k)} ${code ? GAME.pieceName(code) : L('空き', 'empty')}${destSet.has(k) ? L('・動ける', ', can move here') : ''}`);
  }
}
function roleText(g, color) {

  if (g.mode === 'online') { const pl = g.online.players.find(x => seatColor(x.seat) === color); return (color === seatColor(g.online.seat) ? L('あなた・', 'You · ') : '') + (pl ? pl.nick : L('待っています', 'Waiting…')); }
  return color === g.human ? L('あなた', 'You') : L(`${levelName(g.mode)}CPU`, `${levelName(g.mode)} CPU`);
}
function renderPlayers() {
  const g = G(), pos = g.pos, inChk = !g.over && RULES[cur].inCheck(pos);
  for (const [id, color] of [['A', FIRST], ['B', SECOND]]) {
    $('mark' + id).innerHTML = GAME.sideMark(color);
    $('name' + id).textContent = cname(color);

    $('p' + id).classList.toggle('checked', inChk && pos.turn === color);
    $('tag' + id).innerHTML = inChk && pos.turn === color ? `<b>${GAME.checkWord()}</b>` : GAME.materialTag ? GAME.materialTag(pos, color) : '';
    const hand = $('hand' + id);
    hand.dataset.empty = GAME.handEmpty();
    const items = GAME.handItems(pos, color);
    hand.hidden = !items.length && !hand.dataset.empty;
    const mine = canAct() && pos.turn === color;
    hand.innerHTML = items.map(it => it.drop != null
      ? `<button type="button" data-drop="${it.drop}" aria-pressed="${!!(UI.sel && UI.sel.drop === it.drop && pos.turn === color)}" ${mine ? '' : 'disabled'} aria-label="${esc(it.label)}">${it.html}${it.n > 1 ? `<i>${it.n}</i>` : ''}</button>`
      : `<span class="cap" aria-label="${esc(it.label)}">${it.html}${it.n > 1 ? `<i>${it.n}</i>` : ''}</span>`).join('');

}
function renderStatus() {
  const g = G(), st = $('status');
  let main;
  if (g.over) main = `<strong>${resultLine(g)}</strong>`;
  else if (UI.thinking) main = `<strong class="dots">${L(`CPU（${levelName(g.mode)}）が考えています`, `CPU (${levelName(g.mode)}) is thinking`)}</strong>`;
  else if (netWaiting(g)) main = g.online.status === 'waiting' ? `<strong class="dots">${L('相手が部屋に入るのを待っています', 'Waiting for your opponent to join')}</strong>` : `<strong>${L('対局は終わりました', 'The game is over')}</strong>`;
  else if (isRemoteTurn(g)) main = oppAway(g) ? `<strong>${L('相手が部屋を出ています', 'Your opponent has left the room')}</strong>` : `<strong class="dots">${L('相手の手を待っています', "Waiting for your opponent's move")}</strong>`;
  else {
    const chk = RULES[cur].inCheck(g.pos);
    main = L(`<strong>${cname(g.pos.turn)}の番</strong>`, `<strong>${cname(g.pos.turn)} to move</strong>`) + (chk ? ` ・ <strong class="chk">${GAME.checkWord()}</strong>` : '');
  }
  const li = g.lastInfo;
  st.innerHTML = main + (li ? `<small>${esc(L('直前：', 'Last: ') + L(li.ja, li.en))}</small>` : '');
  $('undo').disabled = !g.history.length || g.mode === 'max' || g.mode === 'online' || UI.thinking;
  $('undo').title = g.mode === 'max' ? L('最強戦は待ったなしです', 'No undo against the Strongest') : '';
  $('resign').disabled = g.over || !(g.mode === 'pvp' ? !UI.busy : canAct()) || (g.mode === 'online' && !g.online);
  if ($('resign').disabled) disarmResign();
  $('pendingChamp').hidden = !(g.champ && !g.champ.done && $('result').hidden);
}
function resultLine(g) {
  const r = g.res; if (!r) return '';
  const why = GAME.reasonText(r.reason);
  if (!r.winner) return L(`引き分け（${why}）`, `Draw (${why})`);
  return L(`${cname(r.winner)}の勝ち（${why}）`, `${cname(r.winner)} wins (${why})`);
}
function renderSettings() {
  const g = G();
  paintSide();
  const m = settings.mode;
  const pending = (m !== g.mode && !(m === 'online' && g.mode === 'online')) || (m !== 'pvp' && m !== 'online' && settings.human !== g.human);
  $('pendNote').hidden = !(pending && g.humanMoves > 0 && !g.over && m !== 'online');
  $('newGame').classList.toggle('nudge', !$('pendNote').hidden);
  $('colorRow').hidden = m === 'pvp' || m === 'online';
  $('humanALabel').textContent = GAME.colorLabel(FIRST);
  $('humanBLabel').textContent = GAME.colorLabel(SECOND);
  $('onlineBox').hidden = m !== 'online';
  $('joinBtn').disabled = !RECORD_URL || !!(g.online && g.mode === 'online' && g.online.status !== 'over' && !g.over && !oppAway(g));
  $('leaveBtn').disabled = !(g.online && g.mode === 'online');
  $('modeNote').textContent =
    m === 'pvp' ? L('ひとつの画面で、ふたりが交互に指します。', 'Two players take turns on one screen.')
    : m === 'normal' ? L('2手先まで読みます。ときどき甘い手も指します。', 'Looks 2 moves ahead, and sometimes plays a loose move.')
    : m === 'strong' ? L('1手1.5秒ほどかけて、しっかり読みます。', 'Thinks about a second and a half a move, and reads carefully.')
    : m === 'online' ? (RECORD_URL ? L('インターネットで別の人と対戦します。部屋の名前を2人で決めて、同じ名前で入ってください。', 'Play someone over the internet. Agree on a room name together and both join with it.')
      : L('オンライン対戦は、公開版（GitHubのページ）で使えます。', 'Online play works on the published version (the GitHub page).'))
    : L('手加減なしの本気のCPUです。1手8秒ほど考え、あなたが考えている間も先を読み続けます。待ったはできません。勝つと名前が残ります（トーラスでもねじれでも）。',
      'The all-out CPU, no holding back: about 8 seconds a move, and it keeps reading ahead while you think. No undo. Beat it (on either board) and your name goes in the hall of fame.');
}
function renderVariant() {
  $('tabTorus').setAttribute('aria-selected', String(cur === 0));
  $('tabTwist').setAttribute('aria-selected', String(cur === 1));
  const dims = parts => parts.map(x => `<span>${x}</span>`).join(L(' ・ ', ' · '));
  $('brandDims').innerHTML = dims(GAME.brandDims(cur));
  $('variantNote').textContent = GAME.variantNote(cur);
  $('netNote').textContent = GAME.netNote(cur);
  $('rulesList').innerHTML = GAME.rules(cur).map(x => `<li>${x}</li>`).join('');
}
function refresh() {
  const g = G(), E0 = E();
  UI.legal = g.over ? [] : E0.legalMoves(g.pos);
  UI.moveOf = UI.legal.map(m => ({ m, ...GAME.decode(m) }));
  if (UI.sel) selectTargets(UI.sel);
  const ms = markState();
  V.marks(ms);
  renderNet(ms); renderPlayers(); renderStatus(); renderSettings(); paintSide();
}
function selectTargets(sel) {
  UI.targets = new Map();
  for (const mv of UI.moveOf) {
    if (sel.from >= 0 ? mv.from !== sel.from : mv.drop !== sel.drop) continue;
    if (!UI.targets.has(mv.to)) UI.targets.set(mv.to, []);
    UI.targets.get(mv.to).push(mv);
  }
}
function setHover(k) {
  if (k === UI.hover) return;
  UI.hover = k;
  V.setHover(k);
  for (const s of netSlots) s.el.classList.toggle('hover', s.k === k);
}

/* ================= choosing a move ================= */
function clearSel() { UI.sel = null; UI.targets = new Map(); }
function tapSquare(k) {
  const g = G();
  if (g.over) { toast(L('対局は終わりました。「新しい対局」で始められます', 'The game is over. Press “New game” to play again.')); return; }
  if (UI.busy || isCPUTurn()) return;
  if (g.mode === 'online' && g.online) {
    if (g.online.status !== 'playing') { toast(g.online.status === 'waiting' ? L('部屋に2人そろうと始まります', 'The game starts when both players are in the room.') : L('対局は終わりました', 'The game is over.')); return; }
    if (isRemoteTurn(g)) { toast(L('相手の番です', "It's your opponent's turn.")); return; }
  }
  const code = g.pos.board[k];
  if (UI.sel && UI.targets.has(k)) { choose(UI.targets.get(k)); return; }
  if (code && sideOf(code) === g.pos.turn) {
    if (UI.sel && UI.sel.from === k) { clearSel(); refresh(); return; }
    UI.sel = { from: k }; selectTargets(UI.sel);
    if (!UI.targets.size) toast(L(`${GAME.pieceName(code)}は今動けません`, `That ${GAME.pieceName(code)} can't move right now.`));
    else Sound.select();
    refresh(); return;
  }
  if (UI.sel) { clearSel(); refresh(); return; }
  if (code) toast(L(`${cname(g.pos.turn)}の番です`, `It's ${cname(g.pos.turn)}'s turn.`));
}
function tapHand(drop) {
  const g = G();
  if (!canAct()) return;
  if (UI.sel && UI.sel.drop === drop) { clearSel(); refresh(); return; }
  UI.sel = { from: -1, drop }; selectTargets(UI.sel);
  if (!UI.targets.size) toast(L('打てる場所がありません', 'There is nowhere to drop it.')); else Sound.select();
  refresh();
}
function choose(list) {
  if (list.length === 1) { commit(list[0].m); return; }
  // several moves to the same square: the promotion choice
  const g = G(), opts = GAME.promoOptions(g.pos, list);
  $('promoTitle').textContent = GAME.promoTitle();
  $('promoOpts').innerHTML = opts.map((o, i) => `<button type="button" data-i="${i}">${o.html}<span>${esc(o.label)}</span></button>`).join('');
  $('promoOpts').onclick = e => { const b = e.target.closest('button'); if (!b) return; closePromo(); commit(opts[+b.dataset.i].m); };
  $('promo').hidden = false;
  setTimeout(() => { const b = $('promoOpts').querySelector('button'); if (b) b.focus(); }, 30);
}
function closePromo() { $('promo').hidden = true; $('promoOpts').onclick = null; }
function commit(m) {
  const g = G();
  clearSel();
  if (playMove(m) && g.mode === 'online' && g.online) sendRemote(m, !!RULES[cur].result(g.pos));
}

/* ================= moves ================= */
let moveTimer = 0, cpuTimer = 0, aiToken = 0;
// the path a piece takes on the surface (so it glides across the seams the way it really went)
function moveVector(pos, info) {
  const E0 = E(), code = info.piece, c = sideOf(code);
  if (info.castle) return [xOf(info.to) - xOf(info.from), 0];
  let best = null;
  for (const [dx, dy, slide] of GAME.vectors(code)) {
    let k = info.from, n = 0;
    for (;;) {
      k = GAME.step(E0, k, dx, dy, c); n++;
      if (k < 0 || n > NN) break;
      if (k === info.to) { if (!best || n < best[2]) best = [dx * n, dy * n, n]; break; }
      if (!slide || pos.board[k]) break;
    }
  }
  return best ? [best[0], best[1]] : [0, 0];
}
function playMove(m, fromCPU = false) {
  const g = G(), E0 = E();
  if (UI.busy || g.over) return false;
  if (isCPUTurn() && !fromCPU) return false;
  if (!E0.isLegal(g.pos, m)) return false;
  const info = E0.info(g.pos, m), next = E0.play(g.pos, m);
  if (!next) return false;
  const prev = g.pos;
  g.history.push({ pos: prev, last: g.last, lastInfo: g.lastInfo, moves: g.moves.length, humanMoves: g.humanMoves });
  g.pos = next; g.last = { from: info.drop ? info.to : info.from, to: info.to }; g.moves.push(m);
  if (!fromCPU) g.humanMoves++;
  g.lastInfo = GAME.moveText(prev, m, info);
  UI.busy = true; clearSel(); setHover(-1);
  const dur = (info.drop ? 300 : 420) * SP;
  let end;
  if (info.drop) end = V.dropPiece(info.to, next.board[info.to], dur);
  else {
    const vec = moveVector(prev, info);
    const anim = { from: info.from, to: info.to, vector: vec, dur, captureAt: info.captured ? (info.capturedAt != null ? info.capturedAt : info.to) : -1, hop: GAME.hops(info.piece) };
    if (info.castle) anim.rook = { from: info.castle.rookFrom, to: info.castle.rookTo, vector: [xOf(info.castle.rookTo) - xOf(info.castle.rookFrom), 0] };
    end = V.animateMove(anim);
  }
  Sound.place(dur * 0.85);
  if (info.captured) Sound.capture(dur * 0.85 + 60);
  if (info.check) { Sound.check(dur + 80); }
  refresh();
  const T0 = cur;
  moveTimer = setTimeout(() => {
    if (cur !== T0) return;
    UI.busy = false;
    V.sync(g.pos.board);       // whatever the animation did, the board now matches the position
    if (info.check && !RULES[cur].result(g.pos)) toast(GAME.checkWord() + L('！', '!'), 'warn', 1400);
    advance();
  }, end + 60);
  return true;
}
function advance() {
  const g = G(), res = E().result(g.pos);
  if (res) { g.over = true; g.res = res; }
  refresh();
  if (g.over) finish(); else maybeCPU();
  if (g.mode === 'online') pump();
}
function maybeCPU() {
  clearTimeout(cpuTimer);
  const g = G();
  if (!isCPUTurn() || UI.busy) { AI.kick(); return; }
  UI.busy = true; UI.thinking = true; refresh();
  const id = ++aiToken, t0 = performance.now(), T0 = cur;
  AI.ask({ id, T: cur, pos: E().encodePos(g.pos), level: g.mode }, res => {
    if (res.id !== aiToken || cur !== T0) return;
    const wait = Math.max(0, 420 * SP - (performance.now() - t0));
    cpuTimer = setTimeout(() => {
      if (id !== aiToken || cur !== T0) return;
      UI.busy = false; UI.thinking = false;
      let m = res.move;
      if (!(m != null && E().isLegal(g.pos, m))) m = E().legalMoves(g.pos)[0];
      if (m !== undefined) playMove(m, true); else refresh();
    }, wait);
  });
}
AI.ponderWith(() => {
  const g = G();
  if (g.mode !== 'max' || g.over || isCPUTurn() || document.hidden) return null;
  return { T: cur, pos: E().encodePos(g.pos) };
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) AI.kick(); });
function stopEverything() {
  clearTimeout(moveTimer); clearTimeout(cpuTimer); aiToken++;
  UI.busy = false; UI.thinking = false; clearSel(); closePromo();
  V.clearAnims();
}
function newGame() {
  stopEverything(); hideToast(); closeResult();
  if (G().mode === 'online' && G().online) leaveRoom(true);
  games[cur] = freshGame(cur);
  setView(); V.sync(G().pos.board); refresh(); maybeCPU();
}
function undo() {
  const g = G();
  if (!g.history.length || g.mode === 'max' || g.mode === 'online') return;
  stopEverything(); hideToast();
  let h = g.history.pop();
  if (g.mode !== 'pvp') while (h.pos.turn !== g.human && g.history.length) h = g.history.pop();
  g.pos = h.pos; g.last = h.last; g.lastInfo = h.lastInfo; g.over = false; g.res = null;
  g.moves.length = h.moves; g.humanMoves = h.humanMoves; g.undos++;
  V.sync(g.pos.board); refresh(); maybeCPU();
}
function disarmResign() { if (UI.resignArmed) { clearTimeout(UI.resignArmed); UI.resignArmed = 0; const b = $('resign'); b.classList.remove('armed'); b.textContent = L('投了', 'Resign'); } }
function resignClick() {
  const g = G(), b = $('resign');
  if (b.disabled || g.over) return;
  if (!UI.resignArmed) {
    b.classList.add('armed'); b.textContent = L('もう一度で投了', 'Tap again');
    UI.resignArmed = setTimeout(disarmResign, 3200);
    return;
  }
  disarmResign();
  const loser = g.mode === 'pvp' ? g.pos.turn : g.mode === 'online' && g.online ? seatColor(g.online.seat) : g.human;
  if (g.pos.turn !== loser) return;     // you resign on your own turn (the record says: the side to move resigned)
  stopEverything();
  g.moves.push(-2); g.over = true; g.res = { winner: -loser, reason: 'resign' };
  if (g.mode === 'online' && g.online) sendRemote(-2, true);
  refresh(); finish();
}
function switchVariant(T) {
  if (T === cur) return;
  const og = G();
  if (og.mode === 'online' && og.online && og.online.status !== 'over' && !og.over) { toast(L('オンライン対戦中は盤を変えられません', "You can't change the board during an online game.")); return; }
  stopEverything(); hideToast(); closeResult(true);
  cur = T; store.set('variant', T);
  setView(); V.sync(G().pos.board);
  renderVariant(); refresh();
  const g = G();
  if (g.over && g.champ && !g.champ.done) $('pendingChamp').hidden = false;
  maybeCPU();
}
function setView() {
  const side = viewSide();
  V.setVariant(cur, side, GAME.home(side));
  mapNet();
}
function applySettingsIfFresh() {
  const g = G();
  if (settings.mode === 'online') { refresh(); return; }
  if (g.humanMoves === 0 || g.over) {
    if (g.mode !== settings.mode || g.human !== settings.human) newGame();
  }
  refresh();
}

/* ================= online rooms (through the record keeper, by polling) ================= */
let pollTimer = 0, joining = false;
let onlineMsg = null;
function setOnline(f) { onlineMsg = f; $('onlineStatus').innerHTML = typeof f === 'function' ? f() : f; }
const ONLINE_INTRO = () => L(`同じ部屋の名前を入れた2人で対戦できます。先に入った人が${cname(FIRST)}です。盤（トーラス・ねじれ）も先に入った人に合わせます。`,
  `Two people who enter the same room name play each other. Whoever joins first plays ${cname(FIRST)} and picks the board (torus or twisted).`);
async function joinRoom() {
  const room = $('roomName').value.trim(), nick = $('nickName').value.trim();
  if (!RECORD_URL || joining) return;
  if (!room) { setOnline(() => L('部屋の名前を入れてください。', 'Please enter a room name.')); $('roomName').focus(); return; }
  store.set('lastName', nick || store.get('lastName', '')); store.set('room', room);
  const og = G(), ended = !!(og.mode === 'online' && og.online && og.online.room === room && (og.over || oppAway(og)));
  joining = true; $('joinBtn').disabled = true; setOnline(() => L('部屋に入っています…', 'Joining the room…'));
  try {
    const j = await api({ type: 'room_join', game: GAME_ID, room, variant: VKEY[cur], device: Rec.device, nick, ended });
    if (!j.ok) { const err = j.error; setOnline(() => err ? esc(srvErr(err)) : L('入れませんでした', "Couldn't join the room.")); return; }
    const rv = j.room, T = rv.variant === 'twist' ? 1 : 0;
    stopEverything(); hideToast(); closeResult(true);
    if (T !== cur) { cur = T; store.set('variant', T); renderVariant(); }
    const g = games[cur] = freshGame(cur, 'online', seatColor(rv.seat));
    g.online = { key: j.key, seat: rv.seat, status: rv.status, players: rv.players, moves: [], applied: 0, room };
    setView(); V.sync(g.pos.board);
    syncRoom(rv);
    schedulePoll(400);
  } catch (e) { setOnline(() => L('つながりませんでした。少し待ってからもう一度押してください。', "Couldn't connect. Wait a moment and try again.")); }
  finally { joining = false; refresh(); }
}
function onlineText(g) {
  const o = g.online; if (!o) return () => '';
  const r = esc(o.room), c = seatColor(o.seat);
  if (o.status === 'waiting') return () => L(`部屋「${r}」で相手を待っています。相手にこの部屋の名前を伝えてください。あなたは<b>${cname(c)}</b>です。`,
    `Waiting for an opponent in room “${r}”. Tell them the room name. You are <b>${cname(c)}</b>.`);
  if (g.over || o.status === 'over') return () => L(`部屋「${r}」の対局は終わりました。もう一局するときは、2人とも「部屋に入る」を押してください。`,
    `The game in room “${r}” is over. To play again, both press “Join room”.`);
  if (oppAway(g)) return () => L(`部屋「${r}」の相手が部屋を出ました。相手が入り直すと続きから指せます。新しい相手と始めるときは、もう一度「部屋に入る」を押してください。`,
    `Your opponent left room “${r}”. If they come back, you can carry on. To start with someone new, press “Join room” again.`);
  return () => L(`部屋「${r}」で対局中。あなたは<b>${cname(c)}</b>です。`, `Playing in room “${r}”. You are <b>${cname(c)}</b>.`);
}
function syncRoom(rv) {
  const g = G(), o = g.online; if (!o) return;
  if (!rv.seat) { o.status = 'over'; setOnline(() => L('この部屋では新しい対局が始まりました。入るときはもう一度「部屋に入る」を押してください。', 'A new game has started in this room. To join it, press “Join room” again.')); refresh(); return; }
  if (o.v && rv.v < o.v) return;          // an older answer that arrives after a newer one is ignored
  o.v = rv.v;

  pump();

  if (wasLeft && !g.over) toast(L('相手が部屋を出ました', 'Your opponent left the room'), '', 3000);

}

  window.addEventListener('pagehide', () => { const o = G().online; if (o && RECORD_URL && navigator.sendBeacon) navigator.sendBeacon(RECORD_URL, JSON.stringify({ type: 'room_leave', key: o.key, device: Rec.device })); });
  $(settings.human === SECOND ? 'humanB' : 'humanA').checked = true;
  $(settings.hints ? 'hintOn' : 'hintOff').checked = true;
  setView(); V.sync(G().pos.board);
  const first = netSlots.find(s => !s.ghost); if (first) { first.el.tabIndex = 0; focusK = first.k; }
  renderVariant(); refresh(); renderHall(); loadHall();
  maybeCPU();
}
start();

</script>
